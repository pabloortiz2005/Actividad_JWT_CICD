name: Continuous Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Owner for GHCR
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/peliculapp:latest
            ghcr.io/${{ env.REPO_OWNER }}/peliculapp:${{ github.sha }}

      - name: Smoke Test - Container Health Check
        run: |
          docker run -d -p 8000:8000 --name app_smoke_test \
            -e APP_ENV=testing \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=:memory: \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            ghcr.io/${{ env.REPO_OWNER }}/peliculapp:${{ github.sha }}
          
          sleep 5
          
          # Realizamos una petición de login errónea controlada para verificar que el servidor responde (401 u otro en vez de caerse)
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/api/login || echo "FAILED")
          
          docker stop app_smoke_test && docker rm app_smoke_test
          
          if [ "$STATUS_CODE" = "FAILED" ]; then
            echo "Smoke test falló: El contenedor no responde."
            exit 1
          else
            echo "Smoke test exitoso. Código HTTP: $STATUS_CODE"
          fi